name: hotel-food-service CI

on:
  push:
    paths: ["hotel-food-service/**", ".github/workflows/hotel-food-service-ci.yml"]
  pull_request:
    paths: ["hotel-food-service/**", ".github/workflows/hotel-food-service-ci.yml"]

defaults:
  run:
    working-directory: hotel-food-service

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest
      - name: Seed smoke test
        run: HFS_DATABASE_URL=sqlite:///./ci.db python -m app.seed

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hotel-food-service .
      - name: Container boots on a host-assigned port, seeds demo data, accepts login
        run: |
          docker run -d --name hfs -e PORT=7860 -e HFS_SEED_ON_START=true -p 7860:7860 hotel-food-service
          for i in $(seq 1 30); do curl -fs localhost:7860/health && break; sleep 1; done
          curl -fs localhost:7860/health || { docker logs hfs; exit 1; }
          curl -fs -X POST localhost:7860/api/v1/auth/login \
            -d 'username=manager@example.com&password=Password123' | grep -q access_token \
            || { docker logs hfs; exit 1; }
