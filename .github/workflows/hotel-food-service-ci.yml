name: hotel-food-service CI

on:
  push:
    paths: ["hotel-food-service/**", ".github/workflows/hotel-food-service-ci.yml"]
  pull_request:
    paths: ["hotel-food-service/**", ".github/workflows/hotel-food-service-ci.yml"]

defaults:
  run:
    working-directory: hotel-food-service

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest
      - name: Seed smoke test
        run: HFS_DATABASE_URL=sqlite:///./ci.db python -m app.seed

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hotel-food-service .
      - name: Container boots and answers /health
        run: |
          docker run -d --name hfs -p 8000:8000 hotel-food-service
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs hfs; exit 1
